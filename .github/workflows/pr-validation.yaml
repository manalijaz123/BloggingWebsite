name: PR Validation Workflow

on:
  pull_request:
    branches:
      - develop

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'  # You can change this based on your project requirements

      - name: Install dependencies
        run: npm install

      - name: Lint HTML files using HTMLHint
        run: npx htmlhint "**/*.html"

      - name: Lint CSS files using Stylelint
        run: npx stylelint "**/*.css"

  build:
    runs-on: ubuntu-latest
    needs: linting
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Build static website using Parcel
        run: npx parcel build src/index.html --no-minify
